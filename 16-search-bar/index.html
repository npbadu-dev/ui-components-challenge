<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Bar</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="search-bar-container">
        <i class="fa-solid fa-magnifying-glass ic-1"></i>
        <input type="text" name="search" id="search-box" />
        <i class="fa-solid fa-xmark ic-2"></i>
        <select name="category" id="category" >
          <option value="default">All categories</option>
          <option value="default">Chest workout</option>
          <option value="default">Leg workout</option>
        </select>
        <i class="fa-solid fa-magnifying-glass ic-4"></i>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
