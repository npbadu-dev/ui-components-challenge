<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagination</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="pagination">
        <i class="fa-solid fa-chevron-left cursor navigate"></i>
        <div class="pg pg-more cursor">1</div>
        <div class="pg pg-more cursor">2</div>
        <div class="pg pg-more cursor">3</div>
        <div class="pg pg-more cursor">4</div>
        <i class="fa-solid fa-ellipsis pg pg-dot cursor"></i>
        <div class="pg cursor active">10</div>
        <div class="pg cursor">11</div>
        <i class="fa-solid fa-ellipsis pg pg-dot cursor"></i>
        <div class="pg cursor">19</div>
        <div class="pg cursor">20</div>
        <i class="fa-solid fa-chevron-right cursor navigate"></i>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
