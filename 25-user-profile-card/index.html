<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile Card</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="profile-card">
        <img
          src="assets/profile.png"
          alt="nitesh prasad badu"
          class="profile-img"
        />
        <p class="name">Nitesh Prasad Badu</p>
        <p class="role">Frontend Developer</p>
        <div class="detail">
          <p class="desc">Passionate about building beautiful and responsive</p>
          <p class="desc">web interfaces. I love turning ideas into real</p>
          <p class="desc">products on the web.</p>
        </div>
        <div class="social-media">
          <a
            href="https://github.com/npbadu-dev"
            class="social-icon"
            target="_blank"
          >
            <i class="fa-brands fa-github"></i>
          </a>
          <a href="#" class="social-icon" target="_blank">
            <i class="fa-brands fa-twitter"></i>
          </a>
          <a
            href="https://www.linkedin.com/in/nitesh-prasad-badu/"
            class="social-icon"
            target="_blank"
          >
            <i class="fa-brands fa-linkedin"></i>
          </a>
          <a href="mailto:niteshprasadbadu@gmail.com" class="social-icon" target="">
            <i class="fa-solid fa-envelope"></i>
          </a>
        </div>
        <div class="experience">
          <div class="col1">
            <p class="num">6</p>
            <p class="text">Projects</p>
          </div>
          <div class="col2">
            <p class="num">500+</p>
            <p class="text">Followers</p>
          </div>
          <div class="col3">
            <p class="num">1+</p>
            <p class="text">Years Exp.</p>
          </div>
        </div>
        <button>
          <i class="fa-solid fa-user"></i>
          <span>View Profile</span>
        </button>
      </div>
    </div>
  </body>
</html>
