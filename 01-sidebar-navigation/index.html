<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SideBar Navigation</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-container">
      <nav>
        <div class="side-bar">
          <div class="sidebar-box">
            <div class="nav-logo">

                <i class="fa-brands fa-digital-ocean"></i>
              </div>
              <div class="logo-text">Digital Swoop</div>
            </div>
            <ul class="navigation-link">
              <li class="theme-toggle">
                <div
                  class="theme-toggle-btn flex items-center justify-center gap-5"
                >
                  <i class="fa-solid fa-moon toggle-mode"></i>
                  <!-- <span>Dark Mode</span> -->
                </div>
              </li>
              <li>
                <a href="#" class="nav-link"
                  ><i class="fa-solid fa-table-cells-large"></i>
                  <span>Dashboard</span></a
                >
              </li>
              <li>
                <a href="#" class="nav-link">
                  <i class="fa-solid fa-box-open"></i>
                  <span>All Products</span>
                </a>
              </li>
              <li>
                <a href="#" class="nav-link">
                  <i class="fa-solid fa-box-open"></i>
                  <span>Category</span>
                </a>
              </li>
              <li>
                <a href="#" class="nav-link">
                  <i class="fa-solid fa-clipboard-list"></i>
                  <span>Order List</span>
                </a>
              </li>
              <li>
                <a href="#" class="nav-link">
                  <i class="fa-solid fa-bell"></i>
                  <span>Notifications</span>
                </a>
              </li>
              <li>
                <a href="#" class="nav-link">
                  <i class="fa-solid fa-chart-pie"></i>
                  <span>Reports</span>
                </a>
              </li>
              <li>
                <a href="#" class="nav-link">
                  <i class="fa-solid fa-money-bill-transfer"></i>
                  <span>Transactions</span>
                </a>
              </li>
              <li>
                <a href="#" class="nav-link">
                  <i class="fa-solid fa-star"></i>
                  <span>Review</span>
                </a>
              </li>
              <li>
                <a href="#" class="nav-link">
                  <i class="fa-solid fa-image-portrait"></i>
                  <span>Users</span>
                </a>
              </li>
              <li>
                <a href="#" class="nav-link">
                  <i class="fa-solid fa-circle-user"></i>
                  <span>Admin</span>
                </a>
              </li>
              <li>
                <a href="#" class="nav-link">
                  <i class="fa-solid fa-gear"></i>
                  <span>Setting</span>
                </a>
              </li>
              <li>
                <a href="#" class="nav-link">
                  <i class="fa-solid fa-right-from-bracket"></i>
                  <span>LogOut</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <main class="dashbord-section">
        <div class="section color-1">Hero Section</div>
        <div class="section color-2">About Section</div>
        <div class="section color-1">Experience Section</div>
        <div class="section color-2">Project Section</div>
        <div class="section color-1">Skill Section</div>
        <div class="section color-2">Contact Section</div>
        <footer>Footer</footer>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
