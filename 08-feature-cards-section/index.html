<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feature Card</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-contaier">
      <div class="heading-content">
        <p class="title">Why Choose PixelFit</p>
        <h1 class="heading">Built for your Best Performance</h1>
        <p class="sub-description">
          We combine quality, innovation, and support to help you
        </p>
        <p class="sub-description">stay consistent and reach your goals.</p>
      </div>
      <div class="feature-container">
        <div class="feature-section">
          <div class="row row-1">
            <div class="card card-1">
              <div class="card-heading">
                <div class="card-icon"><i class="fa-solid fa-award"></i></div>
                <div class="card-heading-text">
                  <div class="card-main-heading">Premium Quality</div>
                  <div class="card-subheading">
                    <span class="card-desc">Carefully crafted products</span>
                    <span class="card-desc">using the best materials</span>
                    <span class="card-desc">for long-lasting performance.</span>
                  </div>
                </div>
              </div>
              <div class="card-footer-box col-ored">
                <span class="learn-more">Learn More </span>
                <i class="fa-solid fa-arrow-right-long"></i>
              </div>
              <div class="bg-circle">
                <div class="bg-circle-icon-box">
                  <i class="fa-solid fa-dumbbell bg-circle-icon"></i>
                </div>
              </div>
            </div>
            <div class="card card-2">2</div>
            <div class="card card-3">3</div>
          </div>
          <div class="row row-2">
            <div class="card card-4">4</div>
            <div class="card card-5">5</div>
            <div class="card card-6">6</div>
          </div>
        </div>
      </div>
      <div class="footer"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
