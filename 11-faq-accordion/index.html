<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ Accordion</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="heading-content">
        <p class="title">FAQs</p>
        <h1 class="heading">Frequently Asked Questions</h1>
        <p class="sub-description">
          Everything you need to know about
          <span class="col-ored">PixelFit</span> and our products.
        </p>
      </div>
      <div class="active-faq"></div>
      <div class="inactive-faq">
        <div class="faq-list">
          <div class="faq-bar">
            <div class="faq-content-1">
              <div class="faq-icon-left icon-bg">
                <i class="fa-solid fa-bag-shopping"></i>
              </div>
              <div class="faq-text">Do you offer international shipping?</div>
            </div>
            <div class="faq-content-2 icon-bg">
              <i class="fa-solid fa-plus"></i>
            </div>
          </div>
        </div>
        <div class="faq-list">
          <div class="faq-bar">
            <div class="faq-content-1">
              <div class="faq-icon-left icon-bg">
                <i class="fa-solid fa-rotate-left"></i>
              </div>
              <div class="faq-text">What is your Return Policy?</div>
            </div>
            <div class="faq-content-2 icon-bg">
              <i class="fa-solid fa-plus"></i>
            </div>
          </div>
        </div>
        <div class="faq-list">
          <div class="faq-bar">
            <div class="faq-content-1">
              <div class="faq-icon-left icon-bg">
                <i class="fa-solid fa-credit-card"></i>
              </div>
              <div class="faq-text">What payment methods do you accept?</div>
            </div>
            <div class="faq-content-2 icon-bg">
              <i class="fa-solid fa-plus"></i>
            </div>
          </div>
        </div>
        <div class="faq-list">
          <div class="faq-bar">
            <div class="faq-content-1">
              <div class="faq-icon-left icon-bg">
                <i class="fa-solid fa-shield"></i>
              </div>
              <div class="faq-text">Are my personal and payment details secure?</div>
            </div>
            <div class="faq-content-2 icon-bg">
              <i class="fa-solid fa-plus"></i>
            </div>
          </div>
        </div>
        <div class="faq-list">
          <div class="faq-bar">
            <div class="faq-content-1">
              <div class="faq-icon-left icon-bg">
                <i class="fa-solid fa-headset"></i>
              </div>
              <div class="faq-text">How can I contact customer support?</div>
            </div>
            <div class="faq-content-2 icon-bg">
              <i class="fa-solid fa-plus"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
