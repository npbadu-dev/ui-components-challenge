<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="content-container">
        <div class="left-side">
          <div class="logo">PixelFit</div>
          <h1 class="welcome">Welcome Back!</h1>
          <p class="description">
            Log in to continue your fitness journey and achieve your goals.
          </p>
          <img
            src="assests/hero-img.png"
            alt="image of company"
            class="img-official"
          />
          <div class="feature-box">
            <div class="feature">
              <div class="feature-icon"><i class="fa-solid fa-shield"></i></div>
              <div class="feature-context">
                <p class="feature-heading">Your data is safe with us</p>
                <p class="feature-description">We never share your information.</p>
              </div>
            </div>
          </div>
        </div>
        <div class="right-side"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
