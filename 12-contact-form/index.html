<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="heading-content">
        <div class="title">
          <div class="title-icon-box">
            <i class="fa-regular fa-paper-plane"></i>
          </div>
          <div class="title-text-box">
            Get in Touch
          </div>
        </div>
        <h1 class="heading">We'd Love to Hear From You</h1>
        <p class="sub-description">
          Have a question, suggestion, or just want to say hello?
        </p>
        <p class="sub-description">
          Fill out the form and <span class="col-ored">our team</span> will get back to you as soon as possible.
        </p>
      </div>
      <div class="contact-card-container">
        <div class="contact-form">
          <div class="form-heading">
            <div class="contact-form-icon">
              <i class="fa-solid fa-message"></i>
            </div>
            <div class="contact-form-heading-title-box">
              <div class="contact-form-heading">Send Us a Message</div>
              <div class="contact-form-subheading">We're here to help and answer any questions you might have.</div>
            </div>
          </div>
          <div class="form-box">
            <form action="#">
              <div class="row-1">
                <div class="full-name-section">
                  <label for="full-name">Full Name</label>
                  <input type="text" name="full-name" id="full-name" placeholder="Enter your full name" required>
                </div>
                <div class="email-section">
                  <label for="email">Email</label>
                  <input type="email" name="email" id="email" placeholder="Enter your name" required>
                </div>
              </div>
              <div class="row-2">
                <label for="subject">Subject
                  <textarea name="subject" id="subject"></textarea>
                </label>
              </div>
              <div class="row-3">
                <label for="msg">Your Message</label>
                <textarea name="msg" id="msg"></textarea>
              </div>
              <div class="row-4">
                <input type="radio" name="checkbox" id="checkbox">
                <label for="checkbox">I agree to the <span class="ored">Privacy Policy</span> and <span class="ored">Terms of Services</span>.</label>
              </div>
              <div class="row-5">
                <button type="submit">
                  <i class="fa-solid fa-paper-plane"></i>
                  <span class="msg-desc">Send Message</span>
                </button>
                <div class="submitted">
                  <i class="fa-solid fa-shield"></i>
                  <span class="submit-msg">Your information is safe with us.</span>
                </div>
              </div>
            </form>
          </div>
        </div>
        <div class="contact-feature">112</div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
