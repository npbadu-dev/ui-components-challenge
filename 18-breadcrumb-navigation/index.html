<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BreadCrumb Navigation</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="nav-bar">
        <div class="el el-1">
          <i class="fa-solid fa-house active"></i>
          <span class="active">Home</span>
          <i class="fa-solid fa-chevron-right light-grey"></i>
        </div>
        <div class="el el-2">
          <i class="fa-solid fa-basket-shopping"></i>
          <span class="grey">Shop</span>
          <i class="fa-solid fa-chevron-right light-grey"></i>
        </div>
        <div class="el el-3">
          <i class="fa-solid fa-tv"></i>
          <span class="grey">Electronics</span>
          <i class="fa-solid fa-chevron-right light-grey"></i>
        </div>
        <div class="el el-4">
          <i class="fa-solid fa-headphones"></i>
          <span class="current">Wireless Headphones</span>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
