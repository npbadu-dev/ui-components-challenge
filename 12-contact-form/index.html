<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="heading-content">
        <div class="title">
          <div class="title-icon-box">
            <i class="fa-regular fa-paper-plane"></i>
          </div>
          <div class="title-text-box">Get in Touch</div>
        </div>
        <h1 class="heading">We'd Love to Hear From You</h1>
        <p class="sub-description">
          Have a question, suggestion, or just want to say hello?
        </p>
        <p class="sub-description">
          Fill out the form and <span class="col-ored">our team</span> will get
          back to you as soon as possible.
        </p>
      </div>
      <div class="contact-card-container">
        <div class="contact-form">
          <div class="form-heading">
            <div class="contact-form-icon">
              <i class="fa-solid fa-message"></i>
            </div>
            <div class="contact-form-heading-title-box">
              <div class="contact-form-heading">Send Us a Message</div>
              <div class="contact-form-subheading">
                We're here to help and answer any questions you might have.
              </div>
            </div>
          </div>
          <div class="">
            <form action="#" class="form-box">
              <div class="row-1">
                <div class="section-1 flex-col">
                  <label for="name" class="row1-label">Full Name</label>
                  <div class="input-box">
                    <i class="fa-solid fa-user left-icon"></i>
                    <input
                      type="email"
                      name="name"
                      id="name"
                      placeholder="Enter your full name"
                      required
                    />
                  </div>
                </div>
                <div class="section-1 flex-col">
                  <label for="email" class="row1-label">Email Address</label>
                  <div class="input-box">
                    <i class="fa-solid fa-envelope left-icon"></i>
                    <input
                      type="email"
                      name="email"
                      id="email"
                      placeholder="Enter your email"
                      required
                    />
                  </div>
                </div>
              </div>
              <div class="row-2 flex-col">
                <div class="message-field">
                  <label for="message">Subject</label>

                  <div class="textarea-wrapper subject-wrapper">
                    <span class="message-icon"
                      ><i class="fa-solid fa-tag"></i
                    ></span>

                    <textarea
                      id="message"
                      placeholder="Type your message here..."
                      class="subject-only"
                    ></textarea>
                  </div>
                </div>
              </div>
              <div class="row-3">
                <div class="message-field">
                  <label for="message">Your Message</label>

                  <div class="textarea-wrapper">
                    <span class="message-icon"
                      ><i class="fa-solid fa-pen"></i
                    ></span>

                    <textarea
                      id="message"
                      placeholder="Type your message here..."
                    ></textarea>
                  </div>
                </div>
              </div>
              <div class="sixth-row">
                <input type="checkbox" name="check" id="check" />
                <label for="check" class="check"
                  >I agree to the
                  <span class="col-ored">Terms of Service</span> and
                  <span class="col-ored">Privacy Policy</span></label
                >
              </div>
              <div class="row-5">
                <button type="submit">
                  <i class="fa-solid fa-paper-plane"></i>
                  <span class="msg-desc">Send Message</span>
                </button>
                <div class="submitted">
                  <i class="fa-solid fa-shield"></i>
                  <span class="submit-msg"
                    >Your information is safe with us.</span
                  >
                </div>
              </div>
            </form>
          </div>
        </div>
        <div class="contact-feature">112</div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
