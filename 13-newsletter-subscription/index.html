<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newsletter Subscription</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="heading-content">
        <p class="title">
          <i class="fa-regular fa-envelope title-icon"></i>
          <span class="title-heading">Stay Updated</span>
        </p>
        <h1 class="heading">Stay Inspired. Stay in the Loop.</h1>
        <p class="sub-description">
          Subscribe to our newsletter and get the latest update on new
        </p>
        <p class="sub-description">
          products, exclusive offers, fitness tips, and more - straight to your
          inbox.
        </p>
      </div>
      <div class="subscribe-container">
        <form action="#" class="subscribe-btn-container">
          <i class="fa-regular fa-envelope subs-icon"></i>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Enter your email address"
            required
          />
          <button type="submit" class="btn-submit">
            <span>Subscribe Now</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
      </div>
      <div class="feature-container-box">
        <div class="feature-box">
          <div class="feature-card">
            <div class="feature-icon">
              <i class="fa-solid fa-tag"></i>
            </div>
            <div class="feature-context">
              <div class="feature-heading">Exclusive Offers</div>
              <div class="feature-description-box">
                <p class="desc">Be the first to know about</p>
                <p class="desc">special discounts.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
