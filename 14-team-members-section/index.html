<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Members Section</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="heading-content">
        <p class="title">
          <i class="fa-solid fa-users"></i>
          <span class="title-heading">Our Team</span>
        </p>
        <h1 class="heading">Meet the People Behind the PixelFit</h1>
        <p class="sub-description">
          A passionate team dedicated to delivering quality products
        </p>
        <p class="sub-description">
          and an <span class="ored">exceptional experience</span>.
        </p>
      </div>
      <div class="member-container">
        <div class="member-card-box">
          <div class="member-card">
            <div class="img-box">
              <img src="assests/m-1.jpg" alt="Rohan Shrestha" class="m1-img" />
              <i class="fa-solid fa-bolt img-icon"></i>
            </div>
            <div class="member-name">Rohan Shrestha</div>
            <div class="member-role">Founder & CEO</div>
            <div class="member-desc">
                <p class="desc">Visionary leader with a passion for</p>
                <p class="desc">fitness and innovation.</p>
            </div>
            <div class="member-social-media">
                <i class="fa-brands fa-linkedin media-icon"></i>
                <i class="fa-brands fa-twitter media-icon"></i>
                <i class="fa-regular fa-envelope media-icon"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
