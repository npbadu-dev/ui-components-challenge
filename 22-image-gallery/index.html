<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="text-row">
        <div class="text-box">
          <p class="title">Gallery</p>
          <p class="heading">Explore Our Collection</p>
          <p class="desc">
            Discover moments of strength, focus, and determination.
          </p>
          <p class="desc">Every image tells a story.</p>
        </div>
        <div class="nav-btn-box">
          <button class="all btn">All</button>
          <button class="norm btn">Products</button>
          <button class="norm btn">Lifestyle</button>
          <button class="norm btn">Workouts</button>
          <button class="norm btn">Accessories</button>
        </div>
      </div>
      <div class="img-row">
        <div class="div1 .div1-onl">
          <i class="fa-solid fa-chevron-left left-icon icon"></i>
          <img src="assests/img1.jpg" alt="img1" class="img1" />
          <i class="fa-solid fa-chevron-right right-icon icon"></i>
        </div>
        <div class="div2">
          <img src="assests/img2.jpg" alt="img 2" class="img2" />
        </div>
        <div class="div2">
          <img src="assests/img3.jpg" alt="img 2" class="img2" />
        </div>
        <div class="div2">
          <img src="assests/img4.jpg" alt="img 2" class="img2" />
        </div>
        <div class="div2">
          <img src="assests/img7.jpg" alt="img 2" class="img2" />
        </div>
        <div class="div2">
          <img src="assests/img6.jpg" alt="img 2" class="img2" />
        </div>
        <div class="div2">
          <img src="assests/img5.jpg" alt="img 2" class="img2" />
        </div>
      </div>
      <div class="norm-img-row">
        <div class="norm-img-box active">
          <img src="assests/img1.jpg" alt="img 1" class="norm-img-row2" />
        </div>
        <div class="norm-img-box">
          <img src="assests/img2.jpg" alt="img 1" class="norm-img-row2 hover" />
        </div>
        <div class="norm-img-box">
          <img src="assests/img3.jpg" alt="img 1" class="norm-img-row2 hover" />
        </div>
        <div class="norm-img-box">
          <img src="assests/img4.jpg" alt="img 1" class="norm-img-row2 hover" />
        </div>
        <div class="norm-img-box">
          <img src="assests/img7.jpg" alt="img 1" class="norm-img-row2 hover" />
        </div>
        <div class="norm-img-box">
          <img src="assests/img6.jpg" alt="img 1" class="norm-img-row2 hover" />
        </div>
        <div class="norm-img-box more">
          <p class="m hover">+5</p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
